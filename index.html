<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mine-Api</title>

<style>
:root{
  --primary:#43a047;
  --primary-dark:#2e7d32;
  --whatsapp:#25D366;
  --whatsapp-dark:#128C7E;
  --radius:16px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.9)),
  url('https://i.imgur.com/CFc3sKb.jpeg') center/cover fixed;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:5vw;
}

.container{max-width:900px;width:100%}

.content{
  background:rgba(255,255,255,.06);
  border-radius:var(--radius);
  padding:2rem;
  backdrop-filter:blur(12px);
  text-align:center;
}

h1{color:var(--primary);margin-bottom:1rem}

.version-box{text-align:left;margin-bottom:1rem}

select{
  width:100%;
  padding:.9rem;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:1rem;
}

select option{color:#000}

.info{
  text-align:left;
  font-size:.95rem;
  opacity:.9;
  margin:1rem 0;
}

.btn{
  display:block;
  background:var(--primary);
  padding:1rem;
  border-radius:12px;
  text-decoration:none;
  color:#fff;
  font-weight:bold;
  margin:.5rem 0;
  transition:.3s;
}

.btn:hover{background:var(--primary-dark)}

.btn-whatsapp{
  background:var(--whatsapp);
}

.btn-whatsapp:hover{
  background:var(--whatsapp-dark);
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#43a047;
  color:#fff;
  padding:12px 20px;
  border-radius:20px;
  font-weight:bold;
  display:none;
  z-index:999;
}
</style>
</head>

<body>

<div class="toast" id="toast">🚀 Nueva versión disponible</div>

<div class="container">
  <div class="content">
    <h1>Mine-Api</h1>

    <div class="version-box">
      <label>Selecciona una versión:</label>
      <select id="selector">
        <option>Cargando versiones…</option>
      </select>
    </div>

    <div class="info" id="info">Selecciona una versión</div>

    <a id="download" class="btn" href="#">Descargar APK</a>
    <a id="changelog" class="btn" href="#" target="_blank">Ver changelog</a>

    <!-- BOTÓN WHATSAPP -->
    <a href="https://whatsapp.com/channel/0029Vb6os8sEquiSiC9mHw1M"
       target="_blank"
       class="btn btn-whatsapp">
       Canal de WhatsApp
    </a>

  </div>
</div>

<script>
const repo = "thiagowiegert/Mine-Api";
const CACHE_KEY = "releasesCache";
const CACHE_TIME = 6 * 60 * 60 * 1000;
const LAST_SEEN = "lastSeenRelease";

const selector = document.getElementById("selector");
const info = document.getElementById("info");
const download = document.getElementById("download");
const changelog = document.getElementById("changelog");
const toast = document.getElementById("toast");

async function getReleases(){
  const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
  if(cache && Date.now() - cache.time < CACHE_TIME){
    return cache.data;
  }

  const res = await fetch(`https://api.github.com/repos/${repo}/releases`);
  const data = await res.json();

  localStorage.setItem(CACHE_KEY, JSON.stringify({
    time: Date.now(),
    data
  }));

  return data;
}

function showToast(){
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",5000);
}

function updateInfo(){
  const opt = selector.selectedOptions[0];

  download.href = opt.value;
  changelog.href = opt.dataset.html;

  info.innerHTML = `
    📦 <strong>Tamaño:</strong> ${opt.dataset.size}<br>
    📅 <strong>Fecha:</strong> ${new Date(opt.dataset.date).toLocaleDateString()}<br><br>
    📝 <strong>Notas:</strong><br>${opt.dataset.notes}
  `;

  localStorage.setItem(LAST_SEEN,opt.dataset.date);
}

async function load(){
  const releases = await getReleases();
  selector.innerHTML="";

  releases.forEach(r=>{
    const apk = r.assets.find(a=>a.name.endsWith(".apk"));
    if(!apk) return;

    const op = document.createElement("option");
    op.textContent = r.name || r.tag_name;
    op.value = apk.browser_download_url;
    op.dataset.size = (apk.size/1024/1024).toFixed(2)+" MB";
    op.dataset.date = r.published_at;
    op.dataset.notes = (r.body||"Sin notas").replace(/\n/g,"<br>");
    op.dataset.html = r.html_url;
    selector.appendChild(op);
  });

  selector.selectedIndex = 0;
  updateInfo();

  const lastSeen = localStorage.getItem(LAST_SEEN);
  if(!lastSeen || new Date(releases[0].published_at) > new Date(lastSeen)){
    showToast();
  }
}

selector.addEventListener("change",updateInfo);
load();
</script>

</body>
</html>
