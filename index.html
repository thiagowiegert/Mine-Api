<script>
const repo = "thiagowiegert/Mine-Api";

const selector  = document.getElementById("selector");
const info      = document.getElementById("info");
const download  = document.getElementById("download");
const changelog = document.getElementById("changelog");

function getVersionFromURL(){
  const params = new URLSearchParams(window.location.search);
  return params.get("version");
}

function updateInfo(){
  const opt = selector.selectedOptions[0];
  if(!opt) return;

  download.href  = opt.dataset.apk;
  changelog.href = opt.dataset.url;

  info.innerHTML = `
    📦 <b>Tamaño:</b> ${opt.dataset.size}<br>
    📅 <b>Fecha:</b> ${new Date(opt.dataset.date).toLocaleDateString()}<br><br>
    📝 <b>Notas:</b><br>${opt.dataset.notes}
  `;
}

async function load(){
  try{
    const r = await fetch(`https://api.github.com/repos/${repo}/releases`);
    const releases = await r.json();

    const versionParam = getVersionFromURL();

    // 🔥 Si viene ?version=...
    if(versionParam){
      const found = releases.find(rel =>
        rel.tag_name.replace("v","") === versionParam.replace("v","")
      );

      if(found){
        const apk = found.assets?.find(a=>a.name.endsWith(".apk"));
        if(apk){
          // Descarga inmediata
          window.location.href = apk.browser_download_url;
          return; // Detener ejecución
        }
      }
    }

    // 🔹 Si no hay versión en URL, cargar página normal
    selector.innerHTML = "";

    releases.forEach(rel=>{
      const apk = rel.assets?.find(a=>a.name.endsWith(".apk"));
      if(!apk) return;

      const op = document.createElement("option");
      op.textContent   = rel.name || rel.tag_name;
      op.dataset.apk   = apk.browser_download_url;
      op.dataset.size  = (apk.size/1024/1024).toFixed(2)+" MB";
      op.dataset.date  = rel.published_at;
      op.dataset.notes = rel.body || "Sin notas";
      op.dataset.url   = rel.html_url;

      selector.appendChild(op);
    });

    if(!selector.options.length){
      info.textContent = "No hay versiones disponibles";
      return;
    }

    selector.selectedIndex = 0;
    updateInfo();

  }catch(e){
    info.textContent = "Error al cargar versiones";
  }
}

selector.addEventListener("change", updateInfo);
load();
</script>
