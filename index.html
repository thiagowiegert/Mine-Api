<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mine-Api</title>

<style>
:root{
  --primary:#43a047;
  --primary-dark:#2e7d32;
  --whatsapp:#25D366;
  --whatsapp-dark:#128C7E;
  --b
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.6)),
  url('https://i.imgur.com/CFc3sKb.jpeg') center/cover fixed;
  color:#fff;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:100%;
  max-width:900px;
  padding:2rem;
}

.content{
  background:var(--panel);
  padding:2rem;
  text-align:center;
  max-height:90vh;
  overflow:hidden;
  border-radius:15px;
}

h1{
  color:var(--primary);
  margin-bottom:1rem;
}

.version-box{
  text-align:left;
  margin-bottom:1rem;
}

select{
  width:100%;
  padding:.9rem;
  border-radius:10px;
  border:none;
  background:#2a2a2a;
  color:#fff;
  font-size:1rem;
}

select option{color:#000}

.info{
  text-align:left;
  font-size:.95rem;
  opacity:.9;
  margin:1rem 0;
  max-height:180px;
  overflow-y:auto;
  padding-right:6px;
}

.info::-webkit-scrollbar{
  width:6px;
}
.info::-webkit-scrollbar-thumb{
  background:var(--primary);
  border-radius:10px;
}

.btn{
  display:block;
  background:var(--primary);
  padding:1rem;
  border-radius:10px;
  text-decoration:none;
  color:#fff;
  font-weight:bold;
  margin:.5rem 0;
  transition:.2s;
}

.btn:hover{background:var(--primary-dark)}

.btn-whatsapp{
  background:var(--whatsapp);
}

.btn-whatsapp:hover{
  background:var(--whatsapp-dark);
}

footer{
  margin-top:1.5rem;
  font-size:.85rem;
  opacity:.6;
  line-height:1.4rem;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--primary);
  color:#fff;
  padding:12px 20px;
  border-radius:20px;
  font-weight:bold;
  display:none;
  z-index:999;
  animation:fade 0.5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translate(-50%,20px)}
  to{opacity:1;transform:translate(-50%,0)}
}
</style>
</head>

<body>

<div class="toast" id="toast">🚀 Nueva versión disponible</div>

<div class="container">
  <div class="content">

    <h1>Mine-Api</h1>

    <div class="version-box">
      <label>Selecciona una versión:</label>
      <select id="selector">
        <option>Cargando versiones…</option>
      </select>
    </div>

    <div class="info" id="info">Selecciona una versión</div>

    <a id="download" class="btn" href="#">Descargar APK</a>
    <a id="changelog" class="btn" href="#" target="_blank">Ver changelog</a>

    <a href="https://whatsapp.com/channel/0029Vb6os8sEquiSiC9mHw1M"
       target="_blank"
       class="btn btn-whatsapp">
       Canal de WhatsApp
    </a>

    <footer>
      © 2025 Minecraft Free<br>
      Página v2.1
    </footer>

  </div>
</div>

<script>
const repo = "thiagowiegert/Mine-Api";
const LAST_SEEN = "lastSeenRelease";

const selector = document.getElementById("selector");
const info = document.getElementById("info");
const download = document.getElementById("download");
const changelog = document.getElementById("changelog");
const toast = document.getElementById("toast");

function showToast(){
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 5000);
}

function updateInfo(){
  const opt = selector.selectedOptions[0];

  download.href = opt.value;
  changelog.href = opt.dataset.html;

  info.innerHTML = `
    📦 <strong>Tamaño:</strong> ${opt.dataset.size}<br>
    📅 <strong>Fecha:</strong> ${new Date(opt.dataset.date).toLocaleDateString()}<br><br>
    📝 <strong>Notas:</strong><br>${opt.dataset.notes}
  `;
}

async function load(){
  const res = await fetch(`https://api.github.com/repos/${repo}/releases`);
  const releases = await res.json();

  selector.innerHTML = "";

  releases.forEach(r => {
    const apk = r.assets.find(a => a.name.endsWith(".apk"));
    if(!apk) return;

    const op = document.createElement("option");
    op.textContent = r.name || r.tag_name;
    op.value = apk.browser_download_url;
    op.dataset.size = (apk.size / 1024 / 1024).toFixed(2) + " MB";
    op.dataset.date = r.published_at;
    op.dataset.notes = (r.body || "Sin notas").replace(/\n/g,"<br>");
    op.dataset.html = r.html_url;

    selector.appendChild(op);
  });

  selector.selectedIndex = 0;
  updateInfo();

  const lastSeen = localStorage.getItem(LAST_SEEN);
  if(!lastSeen || new Date(releases[0].published_at) > new Date(lastSeen)){
    showToast();
  }
}

download.addEventListener("click", () => {
  const opt = selector.selectedOptions[0];
  localStorage.setItem(LAST_SEEN, opt.dataset.date);
});

selector.addEventListener("change", updateInfo);
load();
</script>

</body>
</html>
