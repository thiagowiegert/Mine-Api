<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mine-Api</title>

<style>
:root {
  --primary: #43a047;
  --primary-dark: #2e7d32;
  --whatsapp: #25D366;
  --whatsapp-dark: #128C7E;
  --radius: 16px;
}

* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family:'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.9)),
    url('https://i.imgur.com/CFc3sKb.jpeg') center/cover fixed;
  color:white;
  min-height:100vh;
  padding:5vw;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container { width:100%; max-width:900px; }

.content {
  background: rgba(255,255,255,0.05);
  padding: clamp(1rem,4vw,2rem);
  border-radius: var(--radius);
  backdrop-filter: blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  text-align:center;
}

h1 {
  font-size:clamp(1.8rem,6vw,2.5rem);
  color:var(--primary);
  margin-bottom:1rem;
}

.subtitle { opacity:0.9; margin-bottom:1.5rem; }

.version-box { margin-bottom:1rem; text-align:left; }

select {
  width:100%;
  padding:0.9rem;
  margin-top:0.5rem;
  border-radius:12px;
  font-size:1rem;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.1);
  color:white;
}

select option { color:black; }

.info {
  margin:1rem 0;
  font-size:0.95rem;
  opacity:0.9;
  text-align:left;
}

.btn-container {
  display:flex;
  flex-direction:column;
  gap:1rem;
  align-items:center;
}

.btn {
  background-color: var(--primary);
  color:white;
  padding:1rem;
  border-radius:12px;
  font-weight:bold;
  text-decoration:none;
  width:100%;
  max-width:320px;
  transition:0.3s;
}

.btn:hover { background-color: var(--primary-dark); }

.btn-whatsapp {
  background-color: var(--whatsapp);
}

.btn-whatsapp:hover {
  background-color: var(--whatsapp-dark);
}

footer {
  margin-top:1.5rem;
  opacity:0.7;
}

.new-badge {
  display:none;
  background: gold;
  color: black;
  font-weight: bold;
  padding: 4px 10px;
  border-radius: 10px;
  margin-left:10px;
  font-size:0.8rem;
}
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div class="container">
  <main class="content">
    <h1>Mine-Api <span id="newBadge" class="new-badge">Nueva versión disponible</span></h1>
    <p class="subtitle">Descarga cualquier versión desde nuestros servidores</p>

    <div class="version-box">
      <label>Elige una versión:</label>
      <select id="versionSelector">
        <option>Cargando versiones...</option>
      </select>
    </div>

    <div id="releaseInfo" class="info">
      Selecciona una versión para ver los detalles
    </div>

    <div class="btn-container">
      <a id="downloadBtn" href="#" class="btn">
        <i class="fas fa-download"></i> Descargar APK
      </a>

      <a id="changelogBtn" href="#" class="btn" target="_blank">
        <i class="fas fa-scroll"></i> Ver Changelog
      </a>

      <a href="https://whatsapp.com/channel/0029Vb6os8sEquiSiC9mHw1M"
         class="btn btn-whatsapp" target="_blank">
        <i class="fab fa-whatsapp"></i> Canal de WhatsApp
      </a>
    </div>
  </main>

  <footer>© 2025 Minecraft Free</footer>
</div>

<script>
const selector = document.getElementById("versionSelector");
const downloadBtn = document.getElementById("downloadBtn");
const changelogBtn = document.getElementById("changelogBtn");
const info = document.getElementById("releaseInfo");
const newBadge = document.getElementById("newBadge");

const repo = "thiagowiegert/Mine-Api";
const lastReleaseKey = "lastReleaseDate";

async function loadReleases() {
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/releases`);
    const releases = await res.json();

    selector.innerHTML = "";

    if (!releases.length) {
      selector.innerHTML = "<option>No hay versiones</option>";
      return;
    }

    releases.forEach(release => {
      const apk = release.assets.find(a => a.name.endsWith(".apk"));
      if (!apk) return;

      const option = document.createElement("option");
      option.value = apk.browser_download_url;
      option.dataset.size = (apk.size / 1024 / 1024).toFixed(2) + " MB";
      option.dataset.date = release.published_at;
      option.dataset.body = release.body || "Sin notas";
      option.dataset.html = release.html_url;
      option.textContent = release.name || release.tag_name;

      selector.appendChild(option);
    });

    selector.selectedIndex = 0;
    updateInfo();

    const latestDate = new Date(releases[0].published_at).getTime();
    const savedDate = localStorage.getItem(lastReleaseKey);

    if (!savedDate || latestDate > Number(savedDate)) {
      newBadge.style.display = "inline-block";
    }

  } catch (e) {
    selector.innerHTML = "<option>Error al cargar versiones</option>";
    console.error(e);
  }
}

function updateInfo() {
  const opt = selector.selectedOptions[0];

  downloadBtn.href = opt.value;
  changelogBtn.href = opt.dataset.html;

  info.innerHTML = `
    <strong>📦 Tamaño:</strong> ${opt.dataset.size}<br>
    <strong>📅 Fecha:</strong> ${new Date(opt.dataset.date).toLocaleDateString()}<br><br>
    <strong>📝 Notas:</strong><br>${opt.dataset.body.replace(/\n/g, "<br>")}
  `;

  localStorage.setItem(lastReleaseKey, new Date(opt.dataset.date).getTime());
  newBadge.style.display = "none";
}

selector.addEventListener("change", updateInfo);

loadReleases();
</script>

</body>
</html>
