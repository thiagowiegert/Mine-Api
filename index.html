let state = {
  versions: JSON.parse(JSON.stringify(INITIAL_DATA)),
  selected: 0,
  filter: "",
  toast: null,
};

function uid() { return Math.random().toString(36).slice(2, 9); }

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild(buildLayout());
}

function el(tag, cls, props) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (props) Object.assign(e, props);
  return e;
}

function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 1800);
}

function buildLayout() {
  const wrap = el("div", "min-h-screen flex flex-col");

  // Topbar
  const topbar = el("header", "flex items-center justify-between gap-3 px-5 py-3 border-b border-white/10 bg-[#1b1714] sticky top-0 z-20 flex-wrap");
  const brand = el("div", "flex items-center gap-3");
  const dot = el("span", "w-3 h-3 bg-[#7ccf4c]");
  const title = el("span", "font-bold uppercase tracking-widest text-sm");
  title.textContent = "Mine API — Admin Panel";
  brand.append(dot, title);

  const actions = el("div", "flex items-center gap-2 flex-wrap");
  const importBtn = btn("Importar JSON", "fa-solid fa-file-import", () => openImportModal());
  const exportBtn = btn("Descargar JSON", "fa-solid fa-download", downloadJSON, true);
  const copyBtn = btn("Copiar JSON", "fa-solid fa-copy", copyJSON);
  actions.append(importBtn, copyBtn, exportBtn);

  topbar.append(brand, actions);
  wrap.appendChild(topbar);

  // Body
  const body = el("div", "flex flex-1 min-h-0 flex-col md:flex-row");
  body.appendChild(buildSidebar());
  body.appendChild(buildDetail());
  wrap.appendChild(body);

  // JSON preview
  wrap.appendChild(buildPreview());

  // Toast
  if (state.toast) {
    const toast = el("div", "fixed bottom-5 right-5 bg-[#7ccf4c] text-[#12210c] font-bold text-sm px-4 py-2.5 z-50 shadow-none");
    toast.textContent = state.toast;
    wrap.appendChild(toast);
  }

  return wrap;
}

function btn(label, icon, onClick, primary) {
  const b = el("button", `inline-flex items-center gap-2 px-3.5 py-2 text-xs font-bold uppercase tracking-wide border transition-colors ${
    primary
      ? "bg-[#7ccf4c] text-[#12210c] border-[#7ccf4c] hover:bg-[#93e866]"
      : "bg-transparent text-[#f3efe8] border-white/15 hover:border-[#7ccf4c] hover:text-[#7ccf4c]"
  }`);
  const i = el("i", icon + " text-[11px]");
  const span = el("span");
  span.textContent = label;
  b.append(i, span);
  b.addEventListener("click", onClick);
  return b;
}

function buildSidebar() {
  const side = el("aside", "w-full md:w-80 border-b md:border-b-0 md:border-r border-white/10 bg-[#171310] flex flex-col");

  const searchWrap = el("div", "p-3 border-b border-white/10");
  const search = el("input", "w-full bg-[#1e1b19] border border-white/10 px-3 py-2 text-sm focus:outline-none focus:border-[#7ccf4c]", {
    placeholder: "Buscar versión...",
    value: state.filter,
  });
  search.addEventListener("input", (e) => { state.filter = e.target.value; render(); });
  searchWrap.appendChild(search);
  side.appendChild(searchWrap);

  const addWrap = el("div", "p-3 border-b border-white/10");
  const addBtn = el("button", "w-full flex items-center justify-center gap-2 px-3 py-2.5 text-xs font-bold uppercase tracking-wide bg-[#7ccf4c] text-[#12210c] hover:bg-[#93e866]");
  addBtn.innerHTML = '<i class="fa-solid fa-plus text-[11px]"></i><span>Nueva versión</span>';
  addBtn.addEventListener("click", addVersion);
  addWrap.appendChild(addBtn);
  side.appendChild(addWrap);

  const list = el("div", "flex-1 overflow-y-auto max-h-[46vh] md:max-h-none divide-y divide-white/5");
  const filtered = state.versions
    .map((v, i) => ({ v, i }))
    .filter(({ v }) => v.version.toLowerCase().includes(state.filter.toLowerCase()));

  if (!filtered.length) {
    const empty = el("div", "p-4 text-xs text-[#aaa196]");
    empty.textContent = "Sin resultados.";
    list.appendChild(empty);
  }

  filtered.forEach(({ v, i }, pos) => {
    const row = el("div", `group flex items-center gap-2 px-3 py-2.5 cursor-pointer ${i === state.selected ? "bg-[#7ccf4c]/10 border-l-2 border-l-[#7ccf4c]" : "hover:bg-white/5 border-l-2 border-l-transparent"}`);

    const info = el("div", "flex-1 min-w-0 flex flex-col");
    const name = el("div", `text-sm font-bold truncate mono ${i === state.selected ? "text-[#7ccf4c]" : "text-[#f3efe8]"}`);
    name.textContent = v.version || "(sin nombre)";
    const meta = el("div", "text-[11px] text-[#aaa196] truncate");
    meta.textContent = `${v.servidores.length} servidor(es) · ${v.peso || "s/d"}`;
    info.append(name, meta);
    info.addEventListener("click", () => { state.selected = i; render(); });

    const controls = el("div", "flex items-center gap-1 opacity-60 group-hover:opacity-100");
    const upBtn = iconBtn("fa-solid fa-arrow-up", () => moveVersion(i, -1));
    const downBtn = iconBtn("fa-solid fa-arrow-down", () => moveVersion(i, 1));
    const delBtn = iconBtn("fa-solid fa-trash", () => deleteVersion(i), true);
    if (pos === 0) upBtn.disabled = true, upBtn.classList.add("opacity-20", "cursor-not-allowed");
    if (pos === filtered.length - 1) downBtn.disabled = true, downBtn.classList.add("opacity-20", "cursor-not-allowed");
    controls.append(upBtn, downBtn, delBtn);

    row.append(info, controls);
    list.appendChild(row);
  });

  side.appendChild(list);
  return side;
}

function iconBtn(icon, onClick, danger) {
  const b = el("button", `w-6 h-6 flex items-center justify-center text-[10px] border ${danger ? "border-transparent text-[#e0785f] hover:bg-[#e0785f]/15" : "border-transparent text-[#aaa196] hover:text-[#7ccf4c] hover:bg-white/5"}`);
  b.innerHTML = `<i class="${icon}"></i>`;
  b.addEventListener("click", (e) => { e.stopPropagation(); onClick(); });
  return b;
}

function buildDetail() {
  const wrap = el("div", "flex-1 p-4 md:p-6 overflow-y-auto max-h-[54vh] md:max-h-none");
  const v = state.versions[state.selected];

  if (!v) {
    const empty = el("div", "text-sm text-[#aaa196]");
    empty.textContent = "No hay versión seleccionada. Creá una nueva versión para empezar.";
    wrap.appendChild(empty);
    return wrap;
  }

  const label = el("div", "text-[11px] font-bold uppercase tracking-widest text-[#aaa196] mb-4");
  label.textContent = `Editando versión #${state.selected + 1} de ${state.versions.length}`;
  wrap.appendChild(label);

  // Fields
  const grid = el("div", "grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6");
  grid.appendChild(field("Versión", v.version, (val) => { v.version = val; renderKeepPreview(); }));
  grid.appendChild(field("Peso", v.peso, (val) => { v.peso = val; renderKeepPreview(); }));
  grid.appendChild(field("Fecha", v.fecha, (val) => { v.fecha = val; renderKeepPreview(); }));
  wrap.appendChild(grid);

  // Servers
  const serverHeader = el("div", "flex items-center justify-between mb-3");
  const serverTitle = el("div", "text-[11px] font-bold uppercase tracking-widest text-[#aaa196]");
  serverTitle.textContent = `Servidores (${v.servidores.length})`;
  const addServerBtn = el("button", "inline-flex items-center gap-2 px-3 py-1.5 text-xs font-bold uppercase tracking-wide border border-white/15 hover:border-[#7ccf4c] hover:text-[#7ccf4c]");
  addServerBtn.innerHTML = '<i class="fa-solid fa-plus text-[10px]"></i><span>Agregar servidor</span>';
  addServerBtn.addEventListener("click", () => { v.servidores.push({ nombre: "Nuevo servidor", url: "" }); render(); });
  serverHeader.append(serverTitle, addServerBtn);
  wrap.appendChild(serverHeader);

  const serversWrap = el("div", "border border-white/10 divide-y divide-white/10");
  if (!v.servidores.length) {
    const empty = el("div", "p-4 text-xs text-[#aaa196]");
    empty.textContent = "Esta versión no tiene servidores todavía.";
    serversWrap.appendChild(empty);
  }

  v.servidores.forEach((s, si) => {
    const row = el("div", "flex flex-col sm:flex-row gap-2 p-3 items-stretch sm:items-center bg-[#1b1816]");

    const nameInput = el("input", "sm:w-40 bg-[#1e1b19] border border-white/10 px-2.5 py-2 text-sm focus:outline-none focus:border-[#7ccf4c]", { value: s.nombre, placeholder: "Nombre" });
    nameInput.addEventListener("input", (e) => { s.nombre = e.target.value; });
    nameInput.addEventListener("blur", renderKeepPreview);

    const urlInput = el("input", "flex-1 mono bg-[#1e1b19] border border-white/10 px-2.5 py-2 text-sm focus:outline-none focus:border-[#7ccf4c]", { value: s.url, placeholder: "https://..." });
    urlInput.addEventListener("input", (e) => { s.url = e.target.value; });
    urlInput.addEventListener("blur", renderKeepPreview);

    const rowControls = el("div", "flex items-center gap-1 justify-end sm:justify-start");
    const upB = iconBtn("fa-solid fa-arrow-up", () => moveServer(si, -1));
    const downB = iconBtn("fa-solid fa-arrow-down", () => moveServer(si, 1));
    const delB = iconBtn("fa-solid fa-trash", () => { v.servidores.splice(si, 1); render(); }, true);
    if (si === 0) upB.disabled = true, upB.classList.add("opacity-20");
    if (si === v.servidores.length - 1) downB.disabled = true, downB.classList.add("opacity-20");
    rowControls.append(upB, downB, delB);

    row.append(nameInput, urlInput, rowControls);
    serversWrap.appendChild(row);
  });

  wrap.appendChild(serversWrap);
  return wrap;
}

function field(labelText, value, onChange) {
  const w = el("div", "flex flex-col gap-1.5");
  const l = el("label", "text-[10px] font-bold uppercase tracking-widest text-[#aaa196]");
  l.textContent = labelText;
  const input = el("input", "bg-[#1e1b19] border border-white/10 px-3 py-2.5 text-sm font-semibold focus:outline-none focus:border-[#7ccf4c]", { value: value || "" });
  input.addEventListener("input", (e) => onChange(e.target.value));
  w.append(l, input);
  return w;
}

function renderKeepPreview() {
  const previewEl = document.getElementById("json-preview");
  render();
}

function buildPreview() {
  const wrap = el("div", "border-t border-white/10 bg-[#100e0c]");
  const header = el("div", "flex items-center justify-between px-5 py-2.5 border-b border-white/10");
  const t = el("span", "text-[11px] font-bold uppercase tracking-widest text-[#aaa196]");
  t.textContent = "Vista previa del JSON final";
  header.appendChild(t);
  wrap.appendChild(header);

  const pre = el("textarea", "w-full h-40 bg-[#100e0c] text-[#7ccf4c] mono text-xs p-4 focus:outline-none", { readOnly: true });
  pre.value = JSON.stringify(state.versions, null, 2);
  wrap.appendChild(pre);
  return wrap;
}

function addVersion() {
  state.versions.unshift({ version: "vNueva", peso: "0 MB", fecha: "", servidores: [] });
  state.selected = 0;
  render();
}

function deleteVersion(i) {
  if (!confirm(`¿Eliminar la versión "${state.versions[i].version}"?`)) return;
  state.versions.splice(i, 1);
  if (state.selected >= state.versions.length) state.selected = Math.max(0, state.versions.length - 1);
  render();
}

function moveVersion(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= state.versions.length) return;
  [state.versions[i], state.versions[j]] = [state.versions[j], state.versions[i]];
  if (state.selected === i) state.selected = j;
  else if (state.selected === j) state.selected = i;
  render();
}

function moveServer(i, dir) {
  const v = state.versions[state.selected];
  const j = i + dir;
  if (j < 0 || j >= v.servidores.length) return;
  [v.servidores[i], v.servidores[j]] = [v.servidores[j], v.servidores[i]];
  render();
}

function copyJSON() {
  const text = JSON.stringify(state.versions, null, 2);
  navigator.clipboard.writeText(text).then(() => showToast("JSON copiado al portapapeles"));
}

function downloadJSON() {
  const text = JSON.stringify(state.versions, null, 2);
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "versions.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("versions.json descargado");
}

function openImportModal() {
  const overlay = el("div", "fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50");
  const modal = el("div", "bg-[#171310] border border-white/10 w-full max-w-xl flex flex-col");

  const head = el("div", "flex items-center justify-between px-4 py-3 border-b border-white/10");
  const ht = el("span", "text-xs font-bold uppercase tracking-widest");
  ht.textContent = "Importar JSON";
  const closeX = iconBtn("fa-solid fa-xmark", () => overlay.remove());
  head.append(ht, closeX);

  const body = el("div", "p-4 flex flex-col gap-3");
  const desc = el("p", "text-xs text-[#aaa196]");
  desc.textContent = "Pegá el contenido completo de tu versions.json para reemplazar los datos actuales.";
  const textarea = el("textarea", "w-full h-56 bg-[#1e1b19] border border-white/10 mono text-xs p-3 focus:outline-none focus:border-[#7ccf4c]", { placeholder: "[ ... ]" });

  const applyBtn = el("button", "self-end px-4 py-2 text-xs font-bold uppercase tracking-wide bg-[#7ccf4c] text-[#12210c] hover:bg-[#93e866]");
  applyBtn.textContent = "Aplicar";
  applyBtn.addEventListener("click", () => {
    try {
      const parsed = JSON.parse(textarea.value);
      if (!Array.isArray(parsed)) throw new Error("El JSON debe ser un array");
      state.versions = parsed.map((item) => ({
        version: item.version || "",
        peso: item.peso || "",
        fecha: item.fecha || "",
        servidores: Array.isArray(item.servidores) ? item.servidores.map((s) => ({ nombre: s.nombre || "", url: s.url || "" })) : [],
      }));
      state.selected = 0;
      overlay.remove();
      render();
      showToast("JSON importado correctamente");
    } catch (err) {
      alert("Error al parsear el JSON: " + err.message);
    }
  });

  body.append(desc, textarea, applyBtn);
  modal.append(head, body);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

render();
</script>
</body>
</html>
