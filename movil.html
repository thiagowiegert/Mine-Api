<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mine API — Admin Panel Mobile</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
  html, body { font-family: 'Space Grotesk', sans-serif; overscroll-behavior-y: none; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #171310; }
  ::-webkit-scrollbar-thumb { background: #4a433d; }
  textarea { resize: none; }
  input, button, textarea { font-size: 16px; }
</style>
</head>
<body class="bg-[#16110f] text-[#f3efe8] min-h-screen">
<div id="root"></div>

<script>
"use strict";

const JSON_URL = "https://raw.githubusercontent.com/thiagowiegert/Mine-Api/refs/heads/main/versions.json";

let state = {
  versions: [],
  selected: 0,
  filter: "",
  toast: null,
  loading: true,
  loadError: "",
  view: "list", // "list" | "detail"
  sheet: null,  // null | "import" | "preview"
};

function el(tag, cls, props) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (props) Object.assign(e, props);
  return e;
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  root.appendChild(buildApp());
}

function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 1600);
}

function buildApp() {
  const wrap = el("div", "min-h-screen flex flex-col pb-16");

  wrap.appendChild(buildHeader());

  const main = el("main", "flex-1 flex flex-col min-h-0");
  if (state.view === "list") {
    main.appendChild(buildListView());
  } else {
    main.appendChild(buildDetailView());
  }
  wrap.appendChild(main);

  wrap.appendChild(buildBottomBar());

  if (state.sheet === "import") wrap.appendChild(buildImportSheet());
  if (state.sheet === "preview") wrap.appendChild(buildPreviewSheet());

  if (state.toast) {
    const toast = el("div", "fixed bottom-20 left-1/2 -translate-x-1/2 bg-[#7ccf4c] text-[#12210c] font-bold text-xs px-4 py-2.5 z-50 whitespace-nowrap");
    toast.textContent = state.toast;
    wrap.appendChild(toast);
  }

  return wrap;
}

function buildHeader() {
  const header = el("header", "sticky top-0 z-30 bg-[#1b1714] border-b border-white/10");
  const row = el("div", "flex items-center gap-3 px-4 py-3");

  if (state.view === "detail") {
    const backBtn = el("button", "w-9 h-9 flex items-center justify-center border border-white/15 text-[#f3efe8] active:bg-white/10 shrink-0");
    backBtn.innerHTML = '<i class="fa-solid fa-arrow-left text-sm"></i>';
    backBtn.addEventListener("click", () => { state.view = "list"; render(); });
    row.appendChild(backBtn);
  } else {
    const dot = el("span", "w-2.5 h-2.5 bg-[#7ccf4c] shrink-0");
    row.appendChild(dot);
  }

  const title = el("span", "font-bold uppercase tracking-widest text-xs truncate flex-1");
  title.textContent = state.view === "detail"
    ? (state.versions[state.selected]?.version || "Versión")
    : "Mine API — Admin";
  row.appendChild(title);

  header.appendChild(row);
  return header;
}

function buildListView() {
  const wrap = el("div", "flex-1 flex flex-col min-h-0");

  const searchWrap = el("div", "p-3 border-b border-white/10 bg-[#171310]");
  const search = el("input", "w-full bg-[#1e1b19] border border-white/10 px-3 py-3 text-sm focus:outline-none focus:border-[#7ccf4c]", {
    placeholder: "Buscar versión...",
    value: state.filter,
  });
  search.addEventListener("input", (e) => { state.filter = e.target.value; render(); });
  searchWrap.appendChild(search);
  wrap.appendChild(searchWrap);

  const addWrap = el("div", "p-3 border-b border-white/10");
  const addBtn = el("button", "w-full flex items-center justify-center gap-2 px-3 py-3.5 text-xs font-bold uppercase tracking-wide bg-[#7ccf4c] text-[#12210c] active:bg-[#93e866]");
  addBtn.innerHTML = '<i class="fa-solid fa-plus text-[11px]"></i><span>Nueva versión</span>';
  addBtn.addEventListener("click", addVersion);
  addWrap.appendChild(addBtn);
  wrap.appendChild(addWrap);

  if (state.loading) {
    const loadingEl = el("div", "flex-1 flex items-center justify-center p-6 text-xs text-[#aaa196] text-center");
    loadingEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Cargando versions.json desde GitHub…';
    wrap.appendChild(loadingEl);
    return wrap;
  }

  if (state.loadError && !state.versions.length) {
    const errEl = el("div", "flex-1 flex flex-col items-center justify-center gap-3 p-6 text-xs text-[#e0785f] text-center");
    const msg = el("div");
    msg.textContent = state.loadError;
    const retryBtn = el("button", "px-4 py-2 border border-[#e0785f] text-[#e0785f] uppercase text-[11px] font-bold tracking-wide active:bg-[#e0785f]/10");
    retryBtn.textContent = "Reintentar";
    retryBtn.addEventListener("click", loadVersionsFromGitHub);
    errEl.append(msg, retryBtn);
    wrap.appendChild(errEl);
    return wrap;
  }

  const list = el("div", "flex-1 overflow-y-auto divide-y divide-white/5");
  const filtered = state.versions
    .map((v, i) => ({ v, i }))
    .filter(({ v }) => v.version.toLowerCase().includes(state.filter.toLowerCase()));

  if (!filtered.length) {
    const empty = el("div", "p-4 text-xs text-[#aaa196] text-center");
    empty.textContent = "Sin resultados.";
    list.appendChild(empty);
  }

  filtered.forEach(({ v, i }, pos) => {
    const row = el("div", "flex items-center gap-2 px-3 py-3.5 active:bg-white/5");

    const info = el("div", "flex-1 min-w-0 flex flex-col");
    const name = el("div", "text-sm font-bold truncate mono text-[#f3efe8]");
    name.textContent = v.version || "(sin nombre)";
    const meta = el("div", "text-[11px] text-[#aaa196] truncate");
    meta.textContent = `${v.servidores.length} servidor(es) · ${v.peso || "s/d"}`;
    info.append(name, meta);
    info.addEventListener("click", () => { state.selected = i; state.view = "detail"; render(); });

    const chevron = el("div", "text-[#aaa196] px-1");
    chevron.innerHTML = '<i class="fa-solid fa-chevron-right text-xs"></i>';
    chevron.addEventListener("click", () => { state.selected = i; state.view = "detail"; render(); });

    const controls = el("div", "flex items-center gap-1 shrink-0");
    const upBtn = iconBtn("fa-solid fa-arrow-up", () => moveVersion(i, -1));
    const downBtn = iconBtn("fa-solid fa-arrow-down", () => moveVersion(i, 1));
    const delBtn = iconBtn("fa-solid fa-trash", () => deleteVersion(i), true);
    if (pos === 0) upBtn.disabled = true, upBtn.classList.add("opacity-20");
    if (pos === filtered.length - 1) downBtn.disabled = true, downBtn.classList.add("opacity-20");
    controls.append(upBtn, downBtn, delBtn);

    row.append(info, controls, chevron);
    list.appendChild(row);
  });

  wrap.appendChild(list);
  return wrap;
}

function iconBtn(icon, onClick, danger) {
  const b = el("button", `w-9 h-9 flex items-center justify-center text-xs border ${danger ? "border-transparent text-[#e0785f] active:bg-[#e0785f]/15" : "border-transparent text-[#aaa196] active:bg-white/10"}`);
  b.innerHTML = `<i class="${icon}"></i>`;
  b.addEventListener("click", (e) => { e.stopPropagation(); onClick(); });
  return b;
}

function buildDetailView() {
  const wrap = el("div", "flex-1 overflow-y-auto p-4");
  const v = state.versions[state.selected];

  if (!v) {
    const empty = el("div", "text-sm text-[#aaa196] text-center mt-8");
    empty.textContent = "No hay versión seleccionada.";
    wrap.appendChild(empty);
    return wrap;
  }

  const label = el("div", "text-[11px] font-bold uppercase tracking-widest text-[#aaa196] mb-4");
  label.textContent = `Versión #${state.selected + 1} de ${state.versions.length}`;
  wrap.appendChild(label);

  const fields = el("div", "flex flex-col gap-3 mb-6");
  fields.appendChild(field("Versión", v.version, (val) => { v.version = val; }));
  fields.appendChild(field("Peso", v.peso, (val) => { v.peso = val; }));
  fields.appendChild(field("Fecha", v.fecha, (val) => { v.fecha = val; }));
  wrap.appendChild(fields);

  const serverHeader = el("div", "flex items-center justify-between mb-3");
  const serverTitle = el("div", "text-[11px] font-bold uppercase tracking-widest text-[#aaa196]");
  serverTitle.textContent = `Servidores (${v.servidores.length})`;
  const addServerBtn = el("button", "inline-flex items-center gap-2 px-3 py-2 text-[11px] font-bold uppercase tracking-wide border border-white/15 active:border-[#7ccf4c] active:text-[#7ccf4c]");
  addServerBtn.innerHTML = '<i class="fa-solid fa-plus text-[10px]"></i><span>Agregar</span>';
  addServerBtn.addEventListener("click", () => { v.servidores.push({ nombre: "Nuevo servidor", url: "" }); render(); });
  serverHeader.append(serverTitle, addServerBtn);
  wrap.appendChild(serverHeader);

  const serversWrap = el("div", "flex flex-col gap-2");
  if (!v.servidores.length) {
    const empty = el("div", "p-4 text-xs text-[#aaa196] border border-white/10");
    empty.textContent = "Esta versión no tiene servidores todavía.";
    serversWrap.appendChild(empty);
  }

  v.servidores.forEach((s, si) => {
    const card = el("div", "border border-white/10 bg-[#1b1816] p-3 flex flex-col gap-2");

    const topRow = el("div", "flex items-center justify-between gap-2");
    const nameInput = el("input", "flex-1 bg-[#1e1b19] border border-white/10 px-2.5 py-2.5 text-sm font-semibold focus:outline-none focus:border-[#7ccf4c]", { value: s.nombre, placeholder: "Nombre" });
    nameInput.addEventListener("input", (e) => { s.nombre = e.target.value; });
    const delB = iconBtn("fa-solid fa-trash", () => { v.servidores.splice(si, 1); render(); }, true);
    topRow.append(nameInput, delB);

    const urlInput = el("input", "w-full mono bg-[#1e1b19] border border-white/10 px-2.5 py-2.5 text-xs focus:outline-none focus:border-[#7ccf4c]", { value: s.url, placeholder: "https://..." });
    urlInput.addEventListener("input", (e) => { s.url = e.target.value; });

    const moveRow = el("div", "flex items-center gap-2");
    const upB = el("button", "flex-1 flex items-center justify-center gap-1.5 py-2 text-[11px] font-bold uppercase border border-white/10 text-[#aaa196] active:text-[#7ccf4c]");
    upB.innerHTML = '<i class="fa-solid fa-arrow-up text-[10px]"></i><span>Subir</span>';
    upB.addEventListener("click", () => moveServer(si, -1));
    const downB = el("button", "flex-1 flex items-center justify-center gap-1.5 py-2 text-[11px] font-bold uppercase border border-white/10 text-[#aaa196] active:text-[#7ccf4c]");
    downB.innerHTML = '<i class="fa-solid fa-arrow-down text-[10px]"></i><span>Bajar</span>';
    downB.addEventListener("click", () => moveServer(si, 1));
    if (si === 0) upB.disabled = true, upB.classList.add("opacity-20");
    if (si === v.servidores.length - 1) downB.disabled = true, downB.classList.add("opacity-20");
    moveRow.append(upB, downB);

    card.append(topRow, urlInput, moveRow);
    serversWrap.appendChild(card);
  });

  wrap.appendChild(serversWrap);
  return wrap;
}

function field(labelText, value, onChange) {
  const w = el("div", "flex flex-col gap-1.5");
  const l = el("label", "text-[10px] font-bold uppercase tracking-widest text-[#aaa196]");
  l.textContent = labelText;
  const input = el("input", "bg-[#1e1b19] border border-white/10 px-3 py-3 text-sm font-semibold focus:outline-none focus:border-[#7ccf4c]", { value: value || "" });
  input.addEventListener("input", (e) => onChange(e.target.value));
  w.append(l, input);
  return w;
}

function buildBottomBar() {
  const bar = el("div", "fixed bottom-0 left-0 right-0 z-30 bg-[#1b1714] border-t border-white/10 flex items-stretch");

  const items = [
    { icon: "fa-solid fa-file-import", label: "Importar", onClick: () => { state.sheet = "import"; render(); } },
    { icon: "fa-solid fa-code", label: "Vista JSON", onClick: () => { state.sheet = "preview"; render(); } },
    { icon: "fa-solid fa-copy", label: "Copiar", onClick: copyJSON },
    { icon: "fa-solid fa-download", label: "Descargar", onClick: downloadJSON, primary: true },
  ];

  items.forEach((it) => {
    const b = el("button", `flex-1 flex flex-col items-center justify-center gap-1 py-2.5 text-[10px] font-bold uppercase tracking-wide ${it.primary ? "text-[#7ccf4c]" : "text-[#aaa196]"} active:bg-white/5`);
    b.innerHTML = `<i class="${it.icon} text-sm"></i><span>${it.label}</span>`;
    b.addEventListener("click", it.onClick);
    bar.appendChild(b);
  });

  return bar;
}

function buildImportSheet() {
  const overlay = el("div", "fixed inset-0 bg-black/70 z-50 flex flex-col justify-end");
  overlay.addEventListener("click", (e) => { if (e.target === overlay) { state.sheet = null; render(); } });

  const sheet = el("div", "bg-[#171310] border-t border-white/10 max-h-[85vh] flex flex-col");

  const head = el("div", "flex items-center justify-between px-4 py-3 border-b border-white/10 shrink-0");
  const ht = el("span", "text-xs font-bold uppercase tracking-widest");
  ht.textContent = "Importar JSON";
  const closeX = iconBtn("fa-solid fa-xmark", () => { state.sheet = null; render(); });
  head.append(ht, closeX);

  const body = el("div", "p-4 flex flex-col gap-3 overflow-y-auto");
  const desc = el("p", "text-xs text-[#aaa196]");
  desc.textContent = "Pegá el contenido completo de tu versions.json para reemplazar los datos actuales.";
  const textarea = el("textarea", "w-full h-56 bg-[#1e1b19] border border-white/10 mono text-xs p-3 focus:outline-none focus:border-[#7ccf4c]", { placeholder: "[ ... ]" });

  const applyBtn = el("button", "w-full py-3 text-xs font-bold uppercase tracking-wide bg-[#7ccf4c] text-[#12210c] active:bg-[#93e866]");
  applyBtn.textContent = "Aplicar";
  applyBtn.addEventListener("click", () => {
    try {
      const parsed = JSON.parse(textarea.value);
      if (!Array.isArray(parsed)) throw new Error("El JSON debe ser un array");
      state.versions = parsed.map((item) => ({
        version: item.version || "",
        peso: item.peso || "",
        fecha: item.fecha || "",
        servidores: Array.isArray(item.servidores) ? item.servidores.map((s) => ({ nombre: s.nombre || "", url: s.url || "" })) : [],
      }));
      state.selected = 0;
      state.sheet = null;
      state.view = "list";
      render();
      showToast("JSON importado correctamente");
    } catch (err) {
      alert("Error al parsear el JSON: " + err.message);
    }
  });

  body.append(desc, textarea, applyBtn);
  sheet.append(head, body);
  overlay.appendChild(sheet);
  return overlay;
}

function buildPreviewSheet() {
  const overlay = el("div", "fixed inset-0 bg-black/70 z-50 flex flex-col justify-end");
  overlay.addEventListener("click", (e) => { if (e.target === overlay) { state.sheet = null; render(); } });

  const sheet = el("div", "bg-[#100e0c] border-t border-white/10 max-h-[85vh] flex flex-col");

  const head = el("div", "flex items-center justify-between px-4 py-3 border-b border-white/10 shrink-0");
  const ht = el("span", "text-xs font-bold uppercase tracking-widest text-[#aaa196]");
  ht.textContent = "Vista previa del JSON";
  const closeX = iconBtn("fa-solid fa-xmark", () => { state.sheet = null; render(); });
  head.append(ht, closeX);

  const pre = el("textarea", "w-full flex-1 min-h-[50vh] bg-[#100e0c] text-[#7ccf4c] mono text-xs p-4 focus:outline-none", { readOnly: true });
  pre.value = JSON.stringify(state.versions, null, 2);

  sheet.append(head, pre);
  overlay.appendChild(sheet);
  return overlay;
}

function addVersion() {
  state.versions.unshift({ version: "vNueva", peso: "0 MB", fecha: "", servidores: [] });
  state.selected = 0;
  state.view = "detail";
  render();
}

function deleteVersion(i) {
  if (!confirm(`¿Eliminar la versión "${state.versions[i].version}"?`)) return;
  state.versions.splice(i, 1);
  if (state.selected >= state.versions.length) state.selected = Math.max(0, state.versions.length - 1);
  render();
}

function moveVersion(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= state.versions.length) return;
  [state.versions[i], state.versions[j]] = [state.versions[j], state.versions[i]];
  if (state.selected === i) state.selected = j;
  else if (state.selected === j) state.selected = i;
  render();
}

function moveServer(i, dir) {
  const v = state.versions[state.selected];
  const j = i + dir;
  if (j < 0 || j >= v.servidores.length) return;
  [v.servidores[i], v.servidores[j]] = [v.servidores[j], v.servidores[i]];
  render();
}

function copyJSON() {
  const text = JSON.stringify(state.versions, null, 2);
  navigator.clipboard.writeText(text).then(() => showToast("JSON copiado"));
}

function downloadJSON() {
  const text = JSON.stringify(state.versions, null, 2);
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "versions.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("versions.json descargado");
}

async function loadVersionsFromGitHub() {
  state.loading = true;
  state.loadError = "";
  render();

  try {
    const response = await fetch(JSON_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status} ${response.statusText}`);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("El JSON debe ser un array de versiones");

    state.versions = data.map((item) => ({
      version: item?.version || "",
      peso: item?.peso || "",
      fecha: item?.fecha || "",
      servidores: Array.isArray(item?.servidores)
        ? item.servidores.map((server) => ({ nombre: server?.nombre || "", url: server?.url || "" }))
        : [],
    }));
    state.selected = 0;
    showToast(`${state.versions.length} versión(es) cargada(s)`);
  } catch (error) {
    console.error("No se pudo cargar versions.json:", error);
    state.versions = [];
    state.selected = 0;
    state.loadError = `No se pudo cargar el JSON: ${error.message}`;
  } finally {
    state.loading = false;
    render();
  }
}

loadVersionsFromGitHub();
</script>
</body>
</html>
